<!DOCTYPE html>
<html>
<head>
    <title>USB ECG Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: auto; background: #f0f0f0; margin: 10px 0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>USB Serial ECG Test</h1>
    <button onclick="connect()">Connect USB</button>
    <button onclick="sendCommand('START')">Send START</button>
    <button onclick="sendCommand('STOP')">Send STOP</button>
    <button onclick="sendCommand('STATUS')">Send STATUS</button>
    <button onclick="disconnect()">Disconnect</button>
    <div id="output"></div>

    <script>
        let port = null;
        let reader = null;
        
        function log(msg) {
            const out = document.getElementById('output');
            out.innerHTML += msg + '<br>';
            out.scrollTop = out.scrollHeight;
        }
        
        async function connect() {
            try {
                log('🔌 Requesting port...');
                port = await navigator.serial.requestPort();
                log('🔌 Opening port at 115200 baud...');
                await port.open({ baudRate: 115200 });
                log('✅ Connected!');
                
                readSerial();
            } catch (e) {
                log('❌ Error: ' + e.message);
            }
        }
        
        async function readSerial() {
            reader = port.readable.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    
                    // Process complete lines
                    while (buffer.includes('\n')) {
                        const [line, rest] = buffer.split('\n', 2);
                        buffer = rest || '';
                        
                        if (line.trim()) {
                            if (line.startsWith('{')) {
                                try {
                                    const json = JSON.parse(line);
                                    if (json.type === 'ecg-data') {
                                        log(`📊 ECG: ${json.data.length} samples, first=${json.data[0].voltage.toFixed(0)}mV`);
                                    } else {
                                        log(`📨 ${json.type || 'msg'}: ${JSON.stringify(json).substring(0, 100)}`);
                                    }
                                } catch (e) {
                                    log(`❌ Parse error: ${line.substring(0, 50)}`);
                                }
                            } else {
                                log(`📝 ${line.substring(0, 80)}`);
                            }
                        }
                    }
                }
            } finally {
                reader.releaseLock();
            }
        }
        
        async function sendCommand(cmd) {
            if (!port) {
                log('❌ Not connected');
                return;
            }
            try {
                const writer = port.writable.getWriter();
                log(`📤 Sending: ${cmd}`);
                await writer.write(new TextEncoder().encode(cmd + '\n'));
                writer.releaseLock();
            } catch (e) {
                log('❌ Send error: ' + e.message);
            }
        }
        
        async function disconnect() {
            try {
                if (reader) await reader.cancel();
                if (port) await port.close();
                log('❌ Disconnected');
            } catch (e) {
                log('Error: ' + e.message);
            }
        }
    </script>
</body>
</html>

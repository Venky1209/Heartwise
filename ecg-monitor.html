<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeartWise ECG Monitor - Real-Time Display</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .chart-wrapper {
            position: relative;
            height: 500px;
            width: 100%;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-section h3 {
            color: #333;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .status-box {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .status-box .label {
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .status-box .value {
            color: #333;
            font-size: 1.2em;
            font-weight: 700;
        }

        .status-connected {
            color: #10b981;
        }

        .status-disconnected {
            color: #ef4444;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .stat-item {
            background: #f0f7ff;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-top: 5px;
        }

        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .indicator.active {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        .indicator.inactive {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95em;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .chart-wrapper {
                height: 350px;
            }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>❤️ HeartWise ECG Monitor</h1>
            <p>Real-Time Cardiac Signal Visualization</p>
        </div>

        <div class="main-grid">
            <!-- Chart -->
            <div class="chart-container">
                <div class="chart-wrapper">
                    <canvas id="ecgChart"></canvas>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <!-- Connection Status -->
                <div class="control-section">
                    <h3>Connection</h3>
                    <div class="status-box">
                        <div class="label">
                            <span class="indicator" id="statusIndicator"></span>
                            USB Serial
                        </div>
                        <div class="value" id="connectionStatus">Disconnected</div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="control-section">
                    <h3>Controls</h3>
                    <button class="btn btn-primary" id="connectBtn">Connect</button>
                    <button class="btn btn-secondary" id="startBtn" disabled>Start Recording</button>
                    <button class="btn btn-secondary" id="stopBtn" disabled>Stop Recording</button>
                    <button class="btn btn-secondary" id="clearBtn">Clear Data</button>
                </div>

                <!-- Statistics -->
                <div class="control-section">
                    <h3>Statistics</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">Heart Rate</div>
                            <div class="stat-value" id="heartRate">-- BPM</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Data Points</div>
                            <div class="stat-value" id="dataPoints">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Signal Quality</div>
                            <div class="stat-value" id="signalQuality">--</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>🔬 Real-time ECG data from ESP32 AD8232 sensor | USB Serial Connection</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/date-fns/2.29.3/index.min.js"></script>
    <script>
        // Chart configuration
        const ctx = document.getElementById('ecgChart').getContext('2d');
        let ecgChart;
        let ecgData = [];
        let isConnected = false;
        let isRecording = false;
        let port = null;
        let reader = null;

        // Initialize Chart.js
        function initChart() {
            if (ecgChart) ecgChart.destroy();
            
            ecgChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'ECG Signal (mV)',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        fill: true,
                        tension: 0.1,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { font: { size: 12 } }
                        },
                        title: {
                            display: true,
                            text: '5-Second ECG Window (250 Hz)',
                            font: { size: 14, weight: 'bold' }
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Voltage (mV)',
                                font: { weight: 'bold' }
                            },
                            min: -2000,
                            max: 2000,
                            grid: {
                                color: 'rgba(102, 126, 234, 0.1)',
                                drawBorder: true
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Time (seconds)',
                                font: { weight: 'bold' }
                            },
                            grid: {
                                display: true,
                                color: 'rgba(102, 126, 234, 0.05)'
                            }
                        }
                    }
                }
            });
        }

        // USB Serial Connection
        async function connect() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                isConnected = true;
                updateUI();
                document.getElementById('connectionStatus').textContent = 'Connected ✓';
                document.getElementById('statusIndicator').classList.add('active');
                document.getElementById('statusIndicator').classList.remove('inactive');
                
                readSerial();
            } catch (e) {
                alert('Connection failed: ' + e.message);
            }
        }

        async function readSerial() {
            reader = port.readable.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // Process complete JSON lines
                    while (buffer.includes('\n')) {
                        const [line, rest] = buffer.split('\n', 2);
                        buffer = rest || '';

                        if (line.trim().startsWith('{')) {
                            try {
                                const data = JSON.parse(line.trim());
                                
                                // Handle batch data from ESP32
                                if (data.data && Array.isArray(data.data)) {
                                    data.data.forEach(sample => {
                                        if (isRecording) {
                                            addDataPoint(sample);
                                        }
                                    });
                                }
                            } catch (e) {
                                // JSON parse error - ignore
                            }
                        }
                    }
                }
            } catch (error) {
                if (error.name !== 'NetworkError') {
                    console.error('Read error:', error);
                }
            } finally {
                isConnected = false;
                updateUI();
                document.getElementById('connectionStatus').textContent = 'Disconnected';
                document.getElementById('statusIndicator').classList.remove('active');
                document.getElementById('statusIndicator').classList.add('inactive');
            }
        }

        function addDataPoint(sample) {
            const voltage = sample.voltage || 0;
            const time = Date.now();

            ecgData.push({
                time: time,
                voltage: voltage,
                leadsOff: sample.leadsOff || false
            });

            // Keep only last 1250 points (5 seconds at 250 Hz)
            if (ecgData.length > 1250) {
                ecgData.shift();
            }

            updateChart();
            updateStats();
        }

        function updateChart() {
            if (!ecgChart || ecgData.length === 0) return;

            const baseTime = ecgData[0].time;
            const chartData = ecgData.map(point => ({
                x: ((point.time - baseTime) / 1000).toFixed(2),
                y: point.voltage
            }));

            ecgChart.data.labels = chartData.map(d => d.x);
            ecgChart.data.datasets[0].data = chartData.map(d => d.y);
            ecgChart.update('none');
        }

        function updateStats() {
            document.getElementById('dataPoints').textContent = ecgData.length;

            if (ecgData.length > 0) {
                const voltages = ecgData.map(d => d.voltage);
                const avg = voltages.reduce((a, b) => a + b) / voltages.length;
                const quality = Math.abs(avg) > 100 ? 'Good' : 'Weak';
                document.getElementById('signalQuality').textContent = quality;
            }
        }

        function updateUI() {
            document.getElementById('connectBtn').disabled = isConnected;
            document.getElementById('startBtn').disabled = !isConnected || isRecording;
            document.getElementById('stopBtn').disabled = !isRecording;
        }

        // Event Listeners
        document.getElementById('connectBtn').addEventListener('click', connect);

        document.getElementById('startBtn').addEventListener('click', async () => {
            if (port && port.writable) {
                const writer = port.writable.getWriter();
                await writer.write(new TextEncoder().encode('START\n'));
                writer.releaseLock();
                isRecording = true;
                updateUI();
            }
        });

        document.getElementById('stopBtn').addEventListener('click', async () => {
            if (port && port.writable) {
                const writer = port.writable.getWriter();
                await writer.write(new TextEncoder().encode('STOP\n'));
                writer.releaseLock();
                isRecording = false;
                updateUI();
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            ecgData = [];
            updateChart();
            updateStats();
        });

        // Initialize
        initChart();
        updateUI();
    </script>
</body>
</html>
